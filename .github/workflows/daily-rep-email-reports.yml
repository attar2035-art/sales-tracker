name: Daily representative email reports

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      report_date:
        description: 'Optional report date in YYYY-MM-DD format'
        required: false
      test_recipient:
        description: 'Optional test email. When set, sends one sample of each report type to this address only.'
        required: false

jobs:
  send-reports:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Check required secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORTS_FROM_EMAIL: ${{ secrets.REPORTS_FROM_EMAIL }}
          REPORTS_FROM_NAME: ${{ secrets.REPORTS_FROM_NAME }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          node - <<'NODE'
          const required = [
            'SUPABASE_URL',
            'SUPABASE_SERVICE_ROLE_KEY',
            'RESEND_API_KEY',
            'REPORTS_FROM_EMAIL',
            'REPORTS_FROM_NAME',
            'APP_URL',
          ];
          for (const name of required) {
            console.log(`${name}: ${process.env[name] ? 'set' : 'missing'}`);
          }
          const missing = required.filter((name) => !process.env[name]);
          if (missing.length) {
            throw new Error(`Missing secrets: ${missing.join(', ')}`);
          }
          NODE

      - name: Send daily representative and summary reports
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORTS_FROM_EMAIL: ${{ secrets.REPORTS_FROM_EMAIL }}
          REPORTS_FROM_NAME: ${{ secrets.REPORTS_FROM_NAME }}
          APP_URL: ${{ secrets.APP_URL }}
          # Optional: comma-separated fixed admin recipients. Leave the secret
          # unset to auto-detect admins from user_roles (role='admin').
          ADMIN_REPORT_EMAILS: ${{ secrets.ADMIN_REPORT_EMAILS }}
          REPORT_DATE: ${{ github.event.inputs.report_date }}
          TEST_RECIPIENT: ${{ github.event.inputs.test_recipient }}
        run: node tools/send-daily-rep-reports.js
