name: Deploy frontend to GitHub Pages

# Builds the React app and publishes it to GitHub Pages on every push to main
# (and on manual dispatch). This closes the "merged but not deployed" gap:
# after a PR merges to main, the live site updates automatically.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions required by the GitHub Pages deployment actions.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; newer pushes cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # CRA treats warnings as errors when CI=true; keep the build resilient.
          CI: false
          REACT_APP_SUPABASE_URL: https://dujwpemfdbxkqbjqmyot.supabase.co
          # Supabase publishable "anon" key — safe to expose in a frontend build
          # (it is already shipped in the client bundle; RLS protects the data).
          # Add a repo secret REACT_APP_SUPABASE_KEY to override this value.
          REACT_APP_SUPABASE_KEY: ${{ secrets.REACT_APP_SUPABASE_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR1andwZW1mZGJ4a3FianFteW90Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4NDc4MDUsImV4cCI6MjA5NjQyMzgwNX0.qg1HuHozw3LnJ1YrOFpYMhkXbQZvZPj-c-XJlZD391I' }}
        run: npm run build

      - name: SPA fallback (serve index.html for unknown paths)
        run: cp build/index.html build/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
